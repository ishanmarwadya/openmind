<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4">
<title>OpenMind — Vivi, Scribe & the Parent App</title>
<style>
/* ============================================================
   OpenMind — pastel iOS-style system
   ============================================================ */
:root{
  --lav:#B9A9EE;  --lav-d:#6A54C0;  --lav-l:#EFEBFC;
  --sky:#A9C8E8;  --sky-d:#3D6E9E;  --sky-l:#E9F1FA;
  --mint:#A6D5BC; --mint-d:#2E7A57; --mint-l:#E7F4EE;
  --blush:#EFB6C1; --blush-d:#A8455C; --blush-l:#FCEDF0;
  --butter:#EFD79A; --butter-d:#7C5C17; --butter-l:#FBF3E1;
  --peach:#F2C3AA; --peach-d:#914B27; --peach-l:#FDEFE7;
  --r:22px; --r2:16px; --r3:11px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
}
html[data-theme="light"]{
  --bg:#FBFAFE; --group:#F0ECFA; --card:#FFFFFF; --card2:#F7F4FD;
  --line:#E9E3F6; --line2:#D6CDEE;
  --txt:#2E2740; --txt2:#6B6480; --txt3:#8B8399;
  --nav:rgba(251,250,254,.82); --shadow:0 10px 30px rgba(46,39,64,.10);
}
html[data-theme="dark"]{
  --bg:#171522; --group:#1F1C2C; --card:#252135; --card2:#2C2740;
  --line:#332D47; --line2:#42395C;
  --txt:#F3F0FA; --txt2:#B9B1CE; --txt3:#857DA0;
  --nav:rgba(23,21,34,.84); --shadow:0 10px 30px rgba(0,0,0,.45);
  --lav-l:#2A2440; --sky-l:#1F2A38; --mint-l:#1D2E28; --blush-l:#33222A; --butter-l:#302A1E; --peach-l:#33241C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--f);background:#E6E1F4;color:var(--txt);min-height:100dvh;display:flex;align-items:center;justify-content:center}
html[data-theme="dark"] body{background:#0E0D14}
button,input,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px;border-radius:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- responsive shell ---------- */
.phone{width:100%;max-width:430px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;
       overflow:hidden;position:relative}
.side{display:none}
.viewport{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

@media(min-width:520px) and (max-width:1023px){
  body{padding:20px}
  html:not(.wide) .phone{height:min(900px,calc(100dvh - 40px));border-radius:46px;
    box-shadow:0 30px 70px rgba(46,39,64,.30);border:11px solid #2E2740;overflow:hidden}
  html[data-theme="dark"]:not(.wide) .phone{border-color:#332D47}
}
/* full-screen mode: tablet landscape, laptop, desktop */
@media(min-width:1024px){
  body{padding:24px;align-items:stretch}
  html:not(.phonemode) .phone{max-width:1280px;height:calc(100dvh - 48px);border-radius:26px;
    box-shadow:0 26px 64px rgba(46,39,64,.24);border:1px solid var(--line);flex-direction:row;overflow:hidden}
  html:not(.phonemode) .side{display:flex;flex-direction:column;width:240px;flex:none;
    background:var(--card);border-right:1px solid var(--line);padding:20px 14px}
  html:not(.phonemode) .tabs{display:none}
  html:not(.phonemode) .status{display:none}
  html:not(.phonemode) .nav{padding:22px 0 12px}
  html:not(.phonemode) .nav > *{max-width:1040px;margin-left:auto;margin-right:auto;padding-left:30px;padding-right:30px}
  html:not(.phonemode) .big{font-size:36px}
  html:not(.phonemode) .navsub{font-size:15px}
  /* one predictable centred column - nothing can escape it */
  html:not(.phonemode) .body{padding:22px 30px 44px;max-width:1100px;margin:0 auto;width:100%}
  html:not(.phonemode) .card,html:not(.phonemode) .tile{padding:18px}
  html:not(.phonemode) .note{font-size:13.5px}
  html:not(.phonemode) .q{font-size:17px}
  html:not(.phonemode) .li b{font-size:16.5px}
  html:not(.phonemode) .li small{font-size:13px}
  html:not(.phonemode) .grouphead{font-size:13px}
  html:not(.phonemode) .bubble{max-width:560px;font-size:17px}
  html:not(.phonemode) .vivi{width:184px;height:206px}
  html:not(.phonemode) .spring{grid-template-columns:repeat(8,1fr);gap:20px 12px}
  html:not(.phonemode) .appicon .sq{width:66px;height:66px;border-radius:18px}
  html:not(.phonemode) .appicon span{font-size:12px}
  html:not(.phonemode) .stat2{grid-template-columns:repeat(4,1fr)}
  html:not(.phonemode) .sud{width:340px}
  html:not(.phonemode) .board{width:400px}
  html:not(.phonemode) .mem{width:330px}
  html:not(.phonemode) .screen .body2{min-height:230px}
  html:not(.phonemode) .prod .art{height:150px}
  html:not(.phonemode) .chat{max-height:44vh}
  /* explicit two-up: only where the blocks are genuinely independent */
  html:not(.phonemode) .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  html:not(.phonemode) .cols > *{margin-top:0!important}
  html:not(.phonemode) .cols .card{margin-bottom:0}
  html:not(.phonemode) .narrow{max-width:760px}
}
@media(min-width:1280px){
  html:not(.phonemode) .cols.three{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1500px){
  html:not(.phonemode) .body{max-width:1220px}
  html:not(.phonemode) .nav > *{max-width:1160px}
}
/* charts must never stretch to the full column width */
.chartbox{max-width:560px}
/* very narrow phones */
@media(max-width:380px){
  .spring{grid-template-columns:repeat(3,1fr)}
  .big{font-size:29px}
}
/* sidebar items */
.sidebrand{display:flex;align-items:center;gap:9px;padding:2px 8px 18px;font-weight:800;font-size:17px;letter-spacing:-.4px}
.sidenav{display:flex;flex-direction:column;gap:3px}
.sidenav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;background:none;
  border-radius:12px;cursor:pointer;color:var(--txt2);font-size:14.5px;font-weight:600;text-align:left}
.sidenav button:hover{background:var(--group)}
.sidenav button.on{background:var(--lav-l);color:var(--lav-d)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:7px;padding-top:14px;border-top:1px solid var(--line)}
.sidefoot button{border:0;background:var(--group);border-radius:11px;padding:9px 11px;font-size:12.5px;
  font-weight:600;color:var(--txt2);cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}

/* iOS status bar */
.status{flex:none;display:flex;align-items:center;justify-content:space-between;padding:11px 26px 3px;
        font-size:14.5px;font-weight:700;letter-spacing:-.2px;color:var(--txt)}
.status .rt{display:flex;align-items:center;gap:5px}

/* large-title nav bar */
.nav{flex:none;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
     -webkit-backdrop-filter:saturate(180%) blur(20px);padding:2px 18px 8px;border-bottom:.5px solid var(--line)}
.navrow{display:flex;align-items:center;gap:10px;min-height:38px}
.navrow .back{background:none;border:0;color:var(--lav-d);font-size:16px;font-weight:600;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:3px}
.navtitle{font-size:17px;font-weight:700;letter-spacing:-.3px}
.spacer{flex:1}
.iconbtn{width:33px;height:33px;border-radius:50%;background:var(--group);border:0;display:flex;align-items:center;
         justify-content:center;cursor:pointer;color:var(--txt2)}
.big{font-size:33px;font-weight:800;letter-spacing:-1.1px;margin:2px 0 3px;line-height:1.08}
.navsub{font-size:13.5px;color:var(--txt2);margin-bottom:4px;line-height:1.4}

/* scroll body */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 26px}
.grouphead{font-size:12.5px;font-weight:700;letter-spacing:.4px;color:var(--txt3);text-transform:uppercase;margin:20px 4px 8px}
.card{background:var(--card);border-radius:var(--r2);padding:15px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.tile{border-radius:var(--r2);padding:15px;box-shadow:var(--shadow)}

/* iOS inset list */
.list{background:var(--card);border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:.5px solid var(--line);
    cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--txt)}
.li:last-child{border-bottom:0}
.li:active{background:var(--card2)}
.li .lic{width:31px;height:31px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
.li b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.2px}
.li small{display:block;font-size:12.5px;color:var(--txt2);margin-top:1px;line-height:1.35}
.li .chev{color:var(--txt3);font-size:17px;flex:none}

/* app grid - springboard */
.spring{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;padding:4px 2px}
.appicon{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--txt)}
.appicon .sq{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;
             box-shadow:0 4px 12px rgba(46,39,64,.14);transition:transform .14s}
.appicon:active .sq{transform:scale(.9)}
.appicon span{font-size:11px;font-weight:600;letter-spacing:-.1px;text-align:center;line-height:1.2}
.appicon:disabled{opacity:.4}

/* segmented control */
.seg{display:flex;background:var(--group);border-radius:11px;padding:2.5px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:600;
            color:var(--txt2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 3px rgba(46,39,64,.14)}

/* buttons */
.btn{background:var(--lav-d);color:#fff;border:0;border-radius:13px;padding:13px 18px;font-weight:600;
     font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.2px}
.btn.wide{width:100%}
.btn.ghost{background:var(--group);color:var(--txt)}
.btn.sm{padding:9px 14px;font-size:13.5px;border-radius:11px}
.btn.rec{background:var(--blush-d)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.pill{border:0;background:var(--group);color:var(--txt);border-radius:99px;padding:8px 14px;font-size:13px;
      font-weight:600;cursor:pointer}
.pill.on{background:var(--lav-d);color:#fff}
.note{font-size:12.5px;color:var(--txt2);line-height:1.5}
.q{background:var(--lav-l);border-radius:14px;padding:13px 15px;font-size:15.5px;font-weight:600;line-height:1.45;letter-spacing:-.2px}
.ans{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:16px;resize:vertical;
     min-height:70px;background:var(--card);color:var(--txt)}
.ans:focus{outline:none;border-color:var(--lav)}
.ok{color:var(--mint-d);font-weight:700}
.warn{color:var(--blush-d);font-weight:700}

/* stats */
.stat2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat2 .s,.stat3 .s{border-radius:var(--r2);padding:13px;text-align:center;box-shadow:var(--shadow)}
.stat2 b,.stat3 b{display:block;font-size:25px;font-weight:800;letter-spacing:-.9px;font-variant-numeric:tabular-nums}
.stat2 span,.stat3 span{font-size:11px;font-weight:600;color:var(--txt2);display:block;margin-top:3px;line-height:1.25}

/* progress ring + bars */
.ring{transform:rotate(-90deg)}
.track{height:9px;background:var(--group);border-radius:99px;overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;border-radius:99px}
.barrow{margin-bottom:13px}
.barrow span{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}

/* Vivi stage */
.stage{border-radius:var(--r);padding:20px 14px 16px;position:relative;overflow:hidden;
       background:linear-gradient(165deg,var(--lav-l),var(--sky-l))}
.stage .blob{position:absolute;border-radius:50%;filter:blur(3px);opacity:.55}
.vwrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:11px}
.vivi{width:148px;height:166px;animation:float 3.8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.vivi .eye{animation:blink 5.4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.vivi.listening .halo{animation:halo 1.6s ease-out infinite}
@keyframes halo{0%{r:52;opacity:.5}100%{r:84;opacity:0}}
.vivi.speaking .mouth{animation:talk .32s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
@keyframes talk{from{transform:scaleY(.5)}to{transform:scaleY(1.4)}}
.bubble{background:var(--card);color:var(--txt);border-radius:20px;padding:14px 17px;font-size:15.5px;
        font-weight:600;line-height:1.45;max-width:330px;text-align:center;box-shadow:var(--shadow);letter-spacing:-.2px}
.chipst{font-size:11px;font-weight:700;letter-spacing:.6px;padding:5px 12px;border-radius:99px;
        background:var(--card);color:var(--txt2);text-transform:uppercase;box-shadow:var(--shadow)}

/* voice */
.voice{background:var(--card2);border-radius:var(--r2);padding:13px}
.levels{display:flex;gap:3px;align-items:flex-end;height:32px;flex:1}
.levels i{flex:1;background:var(--line2);border-radius:99px;min-height:3px;transition:height .07s linear}
.levels.live i{background:var(--lav-d)}
.rectime{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--blush-d);min-width:40px}
audio{width:100%;margin-top:10px;height:36px}

/* chat */
.chat{display:flex;flex-direction:column;gap:9px;max-height:38dvh;overflow-y:auto}
.bub{max-width:86%;padding:11px 14px;border-radius:19px;font-size:15px;line-height:1.42;letter-spacing:-.2px}
.bub.v{background:var(--group);align-self:flex-start;border-bottom-left-radius:6px}
.bub.c{background:var(--lav-d);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.bub small{display:block;font-size:10px;opacity:.7;font-weight:700;letter-spacing:.5px;margin-bottom:3px}

/* games */
.sud{display:grid;gap:6px;grid-template-columns:repeat(4,1fr);width:min(300px,78vw);margin:0 auto}
.sud button{aspect-ratio:1;border:0;background:var(--card2);border-radius:14px;font-size:24px;font-weight:700;color:var(--txt);cursor:pointer;box-shadow:var(--shadow)}
.sud button.fixed{background:var(--group);color:var(--txt2)}
.sud button.sel{box-shadow:0 0 0 3px var(--lav)}
.pad{display:flex;gap:8px;justify-content:center;margin-top:13px}
.pad button{width:52px;height:52px;border-radius:16px;border:0;background:var(--card);font-size:20px;font-weight:700;color:var(--txt);cursor:pointer;box-shadow:var(--shadow)}
.board{width:min(330px,84vw);margin:0 auto;display:grid;grid-template-columns:repeat(8,1fr);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.board div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(26px,6.4vw);cursor:pointer;user-select:none}
.board .l{background:#EFEBFC}.board .d{background:#B9A9EE}
.board div span{color:#2E2740}
.board .sel{box-shadow:inset 0 0 0 3px var(--mint-d)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;width:min(290px,76vw);margin:0 auto}
.mem button{aspect-ratio:1;border-radius:18px;border:0;background:var(--card2);cursor:pointer;box-shadow:var(--shadow)}
.mem button.lit{background:var(--lav);box-shadow:0 0 20px var(--lav)}
.mem button.hit{background:var(--mint)}

/* lesson screen */
.screen{border-radius:var(--r2);overflow:hidden;background:var(--card2);position:relative;box-shadow:var(--shadow)}
.screen .body2{padding:12px;display:flex;align-items:center;justify-content:center;min-height:168px}
.playbtn{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;
         background:rgba(46,39,64,.42);cursor:pointer;border:0;color:#fff;font-weight:700;font-size:14px}
.steps{display:flex;gap:5px;margin-top:12px}
.steps i{height:5px;flex:1;border-radius:99px;background:var(--group)}
.steps i.on{background:var(--lav-d)}
.fact{background:var(--mint-l);border-radius:14px;padding:13px 15px;font-size:14.5px;line-height:1.5}

/* store */
.prod{border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow);background:var(--card);margin-bottom:13px}
@media(min-width:1024px){html:not(.phonemode) .cols .prod{margin-bottom:0}}
.prod .art{height:132px;display:flex;align-items:center;justify-content:center}
.prod .meta{padding:13px 15px}
.prod b{font-size:16px;font-weight:700;letter-spacing:-.3px}
.prod p{margin:4px 0 10px;font-size:13px;color:var(--txt2);line-height:1.42}
.price{font-size:17px;font-weight:800;color:var(--lav-d)}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.3px}

/* tab bar */
.tabs{flex:none;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
      -webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);
      display:flex;padding:7px 2px calc(7px + env(safe-area-inset-bottom))}
.tabs button{flex:1;background:none;border:0;padding:3px 1px;cursor:pointer;color:var(--txt3);
             font-size:9.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--lav-d)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="phone">
  <div class="side" id="side"></div>
  <div class="viewport">
  <div class="status">
    <span id="clock">9:41</span>
    <span class="rt">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 10.2a1.3 1.3 0 1 0 0 .1zM3.4 6.2a6.5 6.5 0 0 1 9.2 0l1.2-1.3a8.2 8.2 0 0 0-11.6 0zM.7 3.4a10.4 10.4 0 0 1 14.6 0l1.2-1.3a12.1 12.1 0 0 0-17 0z"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".6" y=".6" width="21" height="10.8" rx="3" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="2.2" y="2.2" width="16" height="7.6" rx="1.8" fill="currentColor"/><path d="M23.3 4.2v3.6a2 2 0 0 0 0-3.6z" fill="currentColor" fill-opacity=".45"/></svg>
    </span>
  </div>
  <div id="nav"></div>
  <div class="body" id="view"></div>
  <div class="tabs" id="tabs"></div>
  </div>
</div>

function talk(c,sy){S.childWords+=c||0;S.sysWords+=sy||0;save();}
function remember(skill,prompt,answer){
  S.revision.unshift({skill,prompt,answer,due:[3,10,30][S.revision.length%3]});
  S.revision=S.revision.slice(0,18);
  S.skills[skill]=Math.min(100,(S.skills[skill]||30)+3);save();}
function markDone(id){if(!S.done.includes(id))S.done.push(id);save();}
const talkPct=()=>{const t=S.childWords+S.sysWords;return t?Math.round(S.childWords/t*100):0;};

 srSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)},
 markup(id,label){return `<div class="voice" id="${id}">
   <div class="row" style="gap:11px;flex-wrap:nowrap">
     <button class="btn rec sm" data-voice="${id}">${svg('mic','currentColor','width:16px;height:16px')} ${label||'Speak'}</button>
     <div class="levels" id="${id}_lv">${Array.from({length:20},()=>'<i style="height:3px"></i>').join('')}</div>
     <span class="rectime" id="${id}_t"></span></div>
   <div id="${id}_out"></div>
   <div class="note" id="${id}_msg" style="margin-top:8px">Tap and talk. Your voice stays on this device.</div></div>`},
 async toggle(id,taId){
   if(this.active){this.stop();return;}
   const msg=document.getElementById(id+'_msg');this.target=id;
   if(!this.supported()){msg.innerHTML='<span class="warn">No microphone here.</span> Type instead — on Vivi and Scribe the mic is always on.';
     const ta=document.getElementById(taId);if(ta)ta.focus();return;}
   try{this.stream=await navigator.mediaDevices.getUserMedia({audio:true});}
   catch(e){msg.innerHTML='<span class="warn">Microphone permission declined.</span> You can still type.';return;}
   this.chunks=[];
   try{this.rec=new MediaRecorder(this.stream);}catch(e){msg.innerHTML='<span class="warn">Recording unsupported.</span> Type instead.';return;}
   this.rec.ondataavailable=e=>{if(e.data.size)this.chunks.push(e.data)};
   this.rec.onstop=()=>this._finish(taId);
   this.rec.start();this.active=true;this.secs=0;
   const b=document.querySelector(`[data-voice="${id}"]`);if(b)b.innerHTML=svg('stop','currentColor','width:15px;height:15px')+' Stop';
   msg.textContent='Listening…';
   const v=document.querySelector('.vivi');if(v){v.classList.remove('idle','speaking');v.classList.add('listening');}
   this._meter(id);this._clock(id);if(this.srSupported())this._sr(taId);
 },
 _meter(id){try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();
   const src=this.ctx.createMediaStreamSource(this.stream);this.analyser=this.ctx.createAnalyser();
   this.analyser.fftSize=64;src.connect(this.analyser);
   const data=new Uint8Array(this.analyser.frequencyBinCount),bars=document.getElementById(id+'_lv');
   bars.classList.add('live');
   const loop=()=>{if(!this.active)return;this.analyser.getByteFrequencyData(data);
     [...bars.children].forEach((b,i)=>{b.style.height=Math.max(3,Math.round(data[i%data.length]/255*32))+'px'});
     this.raf=requestAnimationFrame(loop)};loop();}catch(e){}},
 _clock(id){const el=document.getElementById(id+'_t');
   this.timer=setInterval(()=>{this.secs++;if(el)el.textContent='0:'+String(this.secs).padStart(2,'0');
     if(this.secs>=90)this.stop()},1000)},
 _sr(taId){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
   try{this.sr=new SR();this.sr.lang=S.lang==='hi'?'hi-IN':'en-IN';this.sr.interimResults=true;this.sr.continuous=true;
     const ta=document.getElementById(taId),base=ta?ta.value:'';
     this.sr.onresult=ev=>{let s='';for(let i=0;i<ev.results.length;i++)s+=ev.results[i][0].transcript;
       if(ta)ta.value=(base+' '+s).trim()};
     this.sr.onerror=()=>{};this.sr.start();}catch(e){}},
 stop(){if(!this.active)return;this.active=false;
   try{this.rec&&this.rec.state!=='inactive'&&this.rec.stop()}catch(e){}
   try{this.sr&&this.sr.stop()}catch(e){}
   clearInterval(this.timer);cancelAnimationFrame(this.raf);
   try{this.ctx&&this.ctx.close()}catch(e){}
   try{this.stream&&this.stream.getTracks().forEach(x=>x.stop())}catch(e){}
   const id=this.target,b=document.querySelector(`[data-voice="${id}"]`);
   if(b)b.innerHTML=svg('mic','currentColor','width:16px;height:16px')+' Speak';
   const lv=document.getElementById(id+'_lv');
   if(lv){lv.classList.remove('live');[...lv.children].forEach(x=>x.style.height='3px')}
   const v=document.querySelector('.vivi');if(v){v.classList.remove('listening');v.classList.add('idle')}},
 _finish(taId){const id=this.target,out=document.getElementById(id+'_out'),msg=document.getElementById(id+'_msg');
   if(this.chunks.length&&out){const blob=new Blob(this.chunks,{type:this.chunks[0].type||'audio/webm'});
     out.innerHTML=`<audio controls src="${URL.createObjectURL(blob)}"></audio>`;S.recordings++;save();}
   const ta=document.getElementById(taId),said=ta?words(ta.value):0;
   if(msg)msg.innerHTML=said?`Heard about <b>${said} words</b>. Check the text, then send.`
     :'Recorded. Your device could not transcribe it — type the gist instead.';
   if(said)talk(said,0);}
};

  body:`<div class="cols">${list.map(([k,l])=>`

let L={key:null,step:-1,stage:'ask',played:false};
VIEWS.lesson=()=>{
  const l=LESSONS[L.key];if(!l)return VIEWS.learn();
  const total=l.steps.length+2,isOpen=L.step<0,isRecap=L.step>=l.steps.length,isDone=L.stage==='done';

function newSudoku(){const base=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];
 const p=[1,2,3,4].sort(()=>Math.random()-.5);
 const sol=base.map(r=>r.map(v=>p[v-1])),grid=sol.map(r=>r.slice());
 let h=7;while(h>0){const r=(Math.random()*4)|0,c=(Math.random()*4)|0;if(grid[r][c]){grid[r][c]=0;h--}}
 sud={sol,grid,fixed:grid.map(r=>r.map(v=>!!v)),sel:null,solved:false};}

function paintTabs(){
  if(route==='launch'||route==='end'){TABS.classList.add('hidden');return;}
  TABS.classList.remove('hidden');
  const child=[['home','Home','home'],['learn','Learn','school'],['vivi','Vivi','chat'],['revise','Revise','refresh']];

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
 const side=e.target.closest('[data-side]:not([data-side="for"]):not([data-side="against"]):not([data-side="new"])');
 if(side&&(side.dataset.side==='child'||side.dataset.side==='parent')){
   S.side=side.dataset.side;save();curSubj=null;go(S.side==='parent'?'phome':'home');return;}

 const nav=e.target.closest('[data-go]');
 if(nav){const r=nav.getAttribute('data-go');
   if(r==='learn')curSubj=null;
   go(r);return;}

 const act=e.target.closest('[data-act]');
 if(act){const a=act.dataset.act;
   if(a==='theme'){S.theme=S.theme==='light'?'dark':'light';save();paintChrome();return;}
   if(a==='tts'){S.tts=!S.tts;save();if(!S.tts&&window.speechSynthesis)speechSynthesis.cancel();paintChrome();render(route);return;}
   if(a==='net'){S.online=!S.online;save();render(route);return;}
   if(a==='sync'){S.online=true;save();render(route);return;}
   if(a==='phonemode'){document.documentElement.classList.toggle('phonemode');paintSide();return;}
   return;}

 const sw=e.target.closest('[data-side-switch]');
 if(sw){S.side=S.side==='parent'?'child':'parent';save();curSubj=null;go(S.side==='parent'?'phome':'home');return;}

 const vb=e.target.closest('[data-voice]');
 if(vb){const id=vb.dataset.voice;
  const map={vv:'vin',ex:'exin',sk:'skin',sr:'skreb',st:'stin',bt:'bin',vd:'vedwhy',pt:'pwhy',od:'oin',mn:'min',mo:'moin',ln:'lin'};
  Voice.toggle(id,map[id]);return;}

 /* store */
 const buy=e.target.closest('[data-buy]');
 if(buy&&!buy.disabled){const id=buy.dataset.buy;
   if(!S.cart.includes(id))S.cart.push(id);save();render('store');return;}

 /* learn */
 const sb=e.target.closest('[data-subj]');
 if(sb){curSubj=sb.dataset.subj;render('learn');return;}
 const lb=e.target.closest('[data-lesson]');
 if(lb){const k=lb.dataset.lesson;
   if(k==='quit'){L={key:null,step:-1,stage:'ask',played:false};render('learn');return;}
   L={key:k,step:-1,stage:'ask',played:false};render('lesson');say(LESSONS[k].open);return;}
 if(e.target.closest('#lplay')){L.played=true;render('lesson');return;}
 if(e.target.closest('#lsend')){
   const l=LESSONS[L.key],ta=document.getElementById('lin'),tx=ta?ta.value:'';
   if(words(tx)<3){document.getElementById('lmsg').innerHTML='Even a guess counts — give me a sentence.';return;}
   talk(words(tx),0);S.questionsAsked++;
   const isOpen=L.step<0,isRecap=L.step>=l.steps.length;
   if(isRecap){if(!S.lessons.includes(L.key))S.lessons.push(L.key);
     S.skills.Curiosity=Math.min(100,S.skills.Curiosity+4);
     remember('Curiosity',l.recap,tx);markDone('learn');save();
     L.stage='done';curSubj=l.sub;render('lesson');say('Good. I will ask you this again in three days.');return;}
   if(isOpen){L.step=0;L.stage='ask';render('lesson');say(l.steps[0].ask);return;}
   L.stage='fact';render('lesson');say(l.steps[L.step].fact);return;}
 if(e.target.closest('#lnext')){const l=LESSONS[L.key];L.step++;L.stage='ask';render('lesson');
   say(L.step>=l.steps.length?l.recap:l.steps[L.step].ask);return;}
 if(e.target.closest('#lskip')){const l=LESSONS[L.key],isOpen=L.step<0,isRecap=L.step>=l.steps.length;
   const h=isOpen?'Start smaller: have you ever noticed it change? When?'
     :isRecap?'Just the first sentence, then. What would you tell a friend?'
     :'Then guess. A wrong guess I can work with; silence I cannot.';
   document.getElementById('lmsg').innerHTML=h;say(h);talk(0,words(h));return;}

 /* vivi */
 const dm=e.target.closest('[data-demo]');
 if(dm){const k=dm.dataset.demo;
   if(k==='clear'){demoKey=null;demoStep=0;viviLog=[];viviState='idle';}
   else{demoKey=k;demoStep=0;viviState='idle';
     viviLog=[{who:'v',text:'Demo loaded: “'+DEMOS[k].label+'”. Press play and watch me hand the thinking back.'}];}
   render('vivi');return;}
 if(e.target.closest('#demoNext')){const d=DEMOS[demoKey];
   if(demoStep<d.turns.length){const[who,text]=d.turns[demoStep++];
     viviLog.push({who,text});talk(who==='c'?words(text):0,who==='v'?words(text):0);
     viviState=who==='v'?'speaking':'listening';if(who==='v')say(text);
     if(demoStep>=d.turns.length){markDone('vivi');S.questionsAsked+=3;
       remember('Curiosity','In the “'+d.label+'” conversation, what did you work out yourself?',d.turns[d.turns.length-2][1]);}}
   render('vivi');const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;
   setTimeout(()=>{const v=document.querySelector('.vivi');if(v){v.classList.remove('speaking','listening');v.classList.add('idle')}},2200);return;}
 if(e.target.closest('#vsend')){const el=document.getElementById('vin'),tx=el.value.trim();if(words(tx)<3)return;
   viviLog.push({who:'c',text:tx});talk(words(tx),0);
   const rep=(Math.random()<.3?pick(PRAISE)+' ':'')+pick(PROBE);
   viviLog.push({who:'v',text:rep});talk(0,words(rep));viviState='speaking';say(rep);
   if(viviLog.length>=8){markDone('vivi');remember('Curiosity','Vivi asked: '+rep,tx);}
   render('vivi');const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;return;}
 if(e.target.closest('#vask')){S.questionsAsked++;save();
   const line='Ask away — but tell me what you already think the answer is, first.';
   viviLog.push({who:'v',text:line});viviState='idle';say(line);render('vivi');return;}

 /* explain */
 if(e.target.closest('#exnew')){exTopic=pick(EXTOP);render('explain');return;}
 if(e.target.closest('#exdone')){const tx=(document.getElementById('exin')||{}).value||'';
   const m=document.getElementById('exmsg');
   if(words(tx)<8&&!S.recordings){m.innerHTML='Record it or type it — even four sentences will do.';return;}
   talk(words(tx),10);markDone('explain');
   remember('Expression','Explain again, from memory: '+exTopic,tx||'(recorded)');
   m.innerHTML='<b class="ok">Saved.</b> In three days Vivi will ask you this again — without your notes.';return;}

 /* sudoku */
 if(e.target.closest('#sud button')){const b=e.target.closest('button'),r=+b.dataset.r,c=+b.dataset.c;
   if(sud.fixed[r][c])return;sud.sel=[r,c];
   document.querySelectorAll('#sud button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');return;}
 if(e.target.closest('.pad button')&&sud&&sud.sel){const n=+e.target.closest('button').dataset.n,[r,c]=sud.sel;
   sud.grid[r][c]=n;render('sudoku');
   const cells=document.querySelectorAll('#sud button');cells[r*4+c].classList.add('sel');return;}
 if(e.target.closest('#sudcheck')){const flat=sud.grid.flat(),q=document.getElementById('sudq');
   if(flat.includes(0)){q.innerHTML='Not full yet. Which square are you least sure about — and what is stopping you?';return;}
   if(sud.grid.every((row,r)=>row.every((v,c)=>v===sud.sol[r][c]))){
     q.innerHTML='<b class="ok">Solved.</b> Now: which square did you work out <i>first</i>, and what told you the answer?';
     sud.solved=true;markDone('sudoku');talk(0,18);
     remember('Reasoning','In sudoku, which square do you look for first — and why?','The one with the fewest possibilities left.');
   }else q.innerHTML='Something clashes. Go row by row — <b>which row has a number twice?</b>';return;}
 if(e.target.closest('#sudhint')){document.getElementById('sudq').innerHTML='I will not fill it in. Look at the top-left 2×2 box — <b>which two numbers are missing?</b> Only one can go in the empty square. Why?';return;}

 /* chess */
 if(e.target.closest('#board div')){const sq=e.target.closest('div').dataset.sq,p=PUZZ[cp%PUZZ.length];
   if(!csel){csel=sq;render('chess');return;}
   if(csel===p.from&&sq===p.to){cmsg='<b class="ok">Mate.</b> '+p.why+' Could another piece have done it?';
     markDone('chess');talk(0,22);
     remember('Reasoning','How do you spot a back-rank mate?','The king is blocked by its own pawns and a rook or queen reaches the open rank.');
   }else cmsg='Not that one. Play it out in your head: <b>after that move, where does the black king run?</b>';
   csel=null;render('chess');return;}
 if(e.target.closest('#chint')){cmsg=PUZZ[cp%PUZZ.length].hint;render('chess');return;}
 if(e.target.closest('#cskip')){cp++;cmsg='';csel=null;render('chess');return;}

 /* vedic + pattern */
 if(e.target.closest('#vedgo')){const v=VEDIC[vi%VEDIC.length],val=+document.getElementById('vedin').value,m=document.getElementById('vedmsg');
   if(val===v.a){vstage=1;render('vedic');document.getElementById('vedmsg').innerHTML='<b class="ok">Right.</b> Faster than long multiplication, wasn\u2019t it?';}
   else m.innerHTML='Not quite. Do it the slow way once — <b>what do you get?</b> Then tell me where the trick went wrong for you.';return;}
 if(e.target.closest('#vedwhygo')){const tx=document.getElementById('vedwhy').value;
   if(words(tx)<4){document.getElementById('vedmsg').innerHTML='Give me a full sentence.';return;}
   talk(words(tx),12);S.questionsAsked++;markDone('vedic');
   remember('Numbers',VEDIC[vi%VEDIC.length].probe,tx);
   document.getElementById('vedmsg').innerHTML='<b class="ok">Saved.</b> I will ask you this again in three days, from memory.';
   vi++;vstage=0;setTimeout(()=>render('vedic'),1500);return;}
 if(e.target.closest('#pgo')){const p=PATTERNS[pi%PATTERNS.length],val=+document.getElementById('pin').value;
   if(val===p.next){pstage=1;render('pattern');}
   else document.getElementById('pmsg').innerHTML='Not that. <b>Write down the gaps between the numbers</b> — what are they doing?';return;}
 if(e.target.closest('#pwhygo')){const tx=document.getElementById('pwhy').value;
   if(words(tx)<4){document.getElementById('pmsg').innerHTML='A full sentence, in your own words.';return;}
   talk(words(tx),14);markDone('pattern');
   remember('Reasoning','Describe the rule behind 2, 6, 12, 20, 30…','The gap grows by two each time.');
   document.getElementById('pmsg').innerHTML='<b class="ok">Good.</b> The official version: '+PATTERNS[pi%PATTERNS.length].why+' Yours was close enough.';
   pi++;pstage=0;setTimeout(()=>render('pattern'),1900);return;}

 /* memory */
 if(e.target.closest('#memstart')){
   mem.seq=Array.from({length:mem.level},()=>(Math.random()*9)|0);mem.input=[];mem.playing=true;mem.msg='Watch…';
   render('memory');const btns=document.querySelectorAll('#mem button');
   mem.seq.forEach((v,i)=>setTimeout(()=>{if(btns[v]){btns[v].classList.add('lit');setTimeout(()=>btns[v].classList.remove('lit'),420)}},i*640));
   setTimeout(()=>{mem.playing=false;mem.msg='Now repeat the order.';render('memory')},mem.seq.length*640+260);return;}
 const mb=e.target.closest('[data-m]');
 if(mb&&mem.seq.length&&!mem.playing){const v=+mb.dataset.m;mem.input.push(v);
   mb.classList.add('hit');setTimeout(()=>mb.classList.remove('hit'),200);
   const i=mem.input.length-1;
   if(mem.input[i]!==mem.seq[i]){mem.msg='Not that one. <b>Which square did you lose — first, middle or last?</b> That tells you where your attention slipped.';
     mem.seq=[];render('memory');return;}
   if(mem.input.length===mem.seq.length){mem.level++;S.skills.Focus=Math.min(100,S.skills.Focus+3);markDone('memory');talk(0,8);save();
     mem.msg='<b class="ok">All of it.</b> Level '+mem.level+' next. What did you do in your head to hold the order?';
     mem.seq=[];render('memory');}return;}

 /* odd / money / mood */
 const ob=e.target.closest('[data-odd]');if(ob){opick=+ob.dataset.odd;render('odd');return;}
 if(e.target.closest('#ogo')){const tx=document.getElementById('oin').value;
   if(words(tx)<4){document.getElementById('omsg').innerHTML='A reason, in a full sentence.';return;}
   talk(words(tx),10);markDone('odd');S.questionsAsked++;
   remember('Reasoning','Odd one out: '+ODD[oi%ODD.length].items.join(', ')+' — your reason?',tx);
   document.getElementById('omsg').innerHTML='<b class="ok">Accepted.</b> Someone else could pick a different one and still be right — if they can do what you just did.';
   oi++;opick=null;setTimeout(()=>render('odd'),2000);return;}
 const mo2=e.target.closest('[data-money]');if(mo2){mopt=+mo2.dataset.money;render('money');return;}
 if(e.target.closest('#mgo')){const tx=document.getElementById('min').value;
   if(words(tx)<4){document.getElementById('mmsg').innerHTML='Name the thing you gave up.';return;}
   talk(words(tx),12);markDone('money');
   remember('Reasoning','Money choice — what did you give up?',tx);
   document.getElementById('mmsg').innerHTML='<b class="ok">That is the whole idea.</b> Every choice costs you the one you did not make. Economists call it opportunity cost — you just called it by its real name.';
   mi++;mopt=null;setTimeout(()=>render('money'),2400);return;}
 const mdb=e.target.closest('[data-mood]');if(mdb){S.mood=+mdb.dataset.mood;save();render('mood');return;}
 if(e.target.closest('#mogo')){const tx=document.getElementById('moin').value;
   if(words(tx)<4){document.getElementById('momsg').innerHTML='A sentence is enough.';return;}
   talk(words(tx),10);markDone('mood');S.skills.Empathy=Math.min(100,S.skills.Empathy+3);
   remember('Empathy','You felt '+MOODS[S.mood][1].toLowerCase()+' — what set it off?',tx);
   document.getElementById('momsg').innerHTML='<b class="ok">Noted, and private.</b> Your parent sees that you checked in, never what you wrote.';return;}

 /* seekho / story / curiosity */
 const sd=e.target.closest('[data-side]');
 if(sd&&['for','against','new'].includes(sd.dataset.side)){const v=sd.dataset.side;
   if(v==='new'){sk.motion=pick(MOTIONS);render('seekho');return;}
   sk.side=v;sk.stage=1;sk.secs=60;render('seekho');clearInterval(sk.run);
   sk.run=setInterval(()=>{sk.secs--;const el=document.getElementById('sktime');if(el)el.textContent=sk.secs;if(sk.secs<=0)clearInterval(sk.run)},1000);return;}
 if(e.target.closest('#skdone')){clearInterval(sk.run);
   const tx=document.getElementById('skin').value;sk.wordCount=words(tx);
   sk.reasons=Math.max(1,(tx.match(/because|since|so that|first|second|third|also/gi)||[]).length);
   if(sk.wordCount<8){document.getElementById('sk_msg').innerHTML='Say a bit more first — even three short reasons will do.';return;}
   talk(sk.wordCount,20);
   sk.rebut=sk.side==='for'?'Here is the other side: without homework the only practice a child gets is in a noisy classroom with thirty others. <b>What would you replace it with?</b>'
     :'Here is the other side: some things only stick if you do them alone, slowly, at home. <b>How would you get that without homework?</b>';
   sk.stage=2;render('seekho');return;}
 if(e.target.closest('#skrebgo')){const tx=document.getElementById('skreb').value;
   if(words(tx)<5){document.getElementById('sr_msg').innerHTML='Answer it properly — one good sentence.';return;}
   talk(words(tx),10);S.questionsAsked+=2;markDone('seekho');
   S.skills.Expression=Math.min(100,S.skills.Expression+3);
   remember('Expression','You argued about “'+sk.motion+'”. What was the best point against you?',tx);
   sk.stage=3;render('seekho');return;}
 if(e.target.closest('#sknew')){sk={motion:pick(MOTIONS),side:null,stage:0,secs:60,run:null};render('seekho');return;}
 if(e.target.closest('#stgo')){const el=document.getElementById('stin'),tx=el.value.trim();if(words(tx)<3)return;
   story.push({who:'c',text:tx});talk(words(tx),0);
   const turns=['And then? Careful — you have to keep what you just wrote true.','Who else is in the room now? Give them one line of speech.',
     'Something goes wrong here. What is it?','Now end it in one sentence. No cheating with “it was a dream”.'];
   story.push({who:'v',text:turns[Math.min(story.length>>1,turns.length-1)]});talk(0,12);
   if(story.length>=8){markDone('story');remember('Expression','Retell the story you built with Vivi in three sentences.',tx);}
   render('story');return;}
 if(e.target.closest('#bgo')){const tx=document.getElementById('bin').value;
   if(words(tx)<4){document.getElementById('bt_msg').innerHTML='A full sentence — guessing is allowed, silence is not.';return;}
   talk(words(tx),14);S.questionsAsked++;bstep++;
   if(bstep>=bite.steps.length){markDone('bite');remember('Curiosity',bite.q,tx);bite=null;bstep=0;render('bite');
     document.getElementById('bt_extra').innerHTML='<b class="ok">That is the whole chain.</b> Notice I never told you the answer — you built it.';return;}
   render('bite');return;}

 /* revision */
 const rv=e.target.closest('[data-rev]');
 if(rv){const i=+rv.dataset.rev,tx=document.getElementById('rev'+i).value,m=document.getElementById('revmsg'+i);
   if(words(tx)<4){m.innerHTML='From memory, in a full sentence.';return;}
   talk(words(tx),8);
   const nd=S.revision[i].due===3?10:S.revision[i].due===10?30:60;
   m.innerHTML='<b class="ok">Held.</b> This card moves to day '+nd+'.';
   S.revision[i].due=nd;S.skills[S.revision[i].skill]=Math.min(100,(S.skills[S.revision[i].skill]||30)+2);save();return;}

 if(e.target.closest('#restart')){S.secs=20*60;S.over=false;S.childWords=0;S.sysWords=0;S.questionsAsked=0;S.recordings=0;S.done=[];save();render('home');return;}
});

/* ---------- chrome + clock + session ---------- */
function paintChrome(){document.documentElement.setAttribute('data-theme',S.theme);}
function clock(){const d=new Date(),h=d.getHours()%12||12,m=String(d.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent=h+':'+m;}
let tickN=0;
setInterval(()=>{
  if(S.side!=='child'||S.over)return;
  S.secs--;if(S.secs<=0){S.secs=0;S.over=true;save();render('end');}
  if(++tickN%10===0)save();
},1000);
setInterval(clock,10000);

paintChrome();clock();render('launch');
</script></body></html>
