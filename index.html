<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0620">
<title>OpenMind OS — prototype</title>
<style>
:root{
  --violet:#7C5CF0; --violet2:#A78BFA; --indigo:#4C6FFF;
  --cyan:#22D3EE;   --teal:#2DD4BF;    --mint:#34D399;
  --rose:#FB7185;   --plum:#C084FC;    --sky:#38BDF8;
  --r:20px; --r2:14px; --r3:10px;
  --f: ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0B0620; --panel:#150B3D; --panel2:#1D1152; --raise:#251563;
  --line:#2E1A78; --line2:#3B2496;
  --txt:#F4F1FE; --txt2:#B9A5FA; --txt3:#8B7BC8;
  --core:#8B6CF5; --core-ink:#150B3D;
  --shadow:0 18px 44px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#F6F4FD; --panel:#FFFFFF; --panel2:#F2EEFE; --raise:#EAE3FC;
  --line:#E7E0FA; --line2:#D3C7F5;
  --txt:#150B3D; --txt2:#575178; --txt3:#8B85AB;
  --core:#5B3FE8; --core-ink:#FFFFFF;
  --shadow:0 18px 44px rgba(21,11,61,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--txt);min-height:100dvh;display:flex;align-items:center;justify-content:center}
button,input,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--violet2);outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.shell{width:100%;max-width:1180px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:1000px){body{padding:22px}
 .shell{height:min(772px,calc(100dvh - 44px));border-radius:28px;box-shadow:var(--shadow);border:9px solid #0B0620;overflow:hidden}
 html[data-theme="light"] .shell{border-color:#221461}}

/* top bar */
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:9px 13px 10px;flex:none}
.trow{display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px;flex:none}
.brand{font-weight:800;font-size:14.5px;letter-spacing:-.2px;margin-right:2px}
.pill{font-size:10px;font-weight:800;padding:5px 9px;border-radius:99px;background:var(--panel2);color:var(--txt2);border:1px solid var(--line);cursor:pointer;letter-spacing:.3px;white-space:nowrap}
.pill.on{background:var(--core);color:var(--core-ink);border-color:var(--core)}
.pill.live{background:rgba(45,212,191,.16);color:var(--teal);border-color:rgba(45,212,191,.4)}
.spacer{flex:1}
.ring{width:36px;height:36px;flex:none}
.meter{margin-top:9px}
.meterhead{display:flex;justify-content:space-between;font-size:9.5px;color:var(--txt3);font-weight:800;letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}
.mbar{height:9px;border-radius:99px;background:var(--panel2);overflow:hidden;display:flex;border:1px solid var(--line)}
.mbar i{display:block;height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.mbar i.child{background:linear-gradient(90deg,var(--violet),var(--cyan))}
.mbar i.sys{background:var(--line2);opacity:.55}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{padding:14px 13px 20px;max-width:900px;margin:0 auto}
@media(min-width:1000px){.wrap{padding:20px 26px 28px}}
h1{font-size:24px;line-height:1.12;margin:0 0 5px;letter-spacing:-.6px}
h2{font-size:13.5px;margin:20px 0 9px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.eyebrow{font-size:9.5px;font-weight:800;letter-spacing:.9px;color:var(--txt3);text-transform:uppercase}
p.sub{margin:0 0 14px;color:var(--txt2);font-size:13px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.tag{font-size:9px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--txt2);border:1px solid var(--line)}

.hero{border-radius:var(--r);padding:16px;border:1px solid var(--line2);position:relative;overflow:hidden;background:linear-gradient(135deg,#3B2496 0%,#1D1152 60%,#150B3D 100%)}
html[data-theme="light"] .hero{background:linear-gradient(135deg,#5B3FE8 0%,#7C5CF0 55%,#A78BFA 100%);border-color:transparent}
.hero h3{margin:0 0 3px;font-size:17px;color:#fff;letter-spacing:-.3px}
.hero p{margin:0 0 13px;color:#C9BAFB;font-size:12px}
.hero .glow{position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.35),transparent 70%);right:-50px;top:-70px;pointer-events:none}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio button{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--r3);padding:10px 9px;text-align:left;cursor:pointer;font-size:11.5px;font-weight:700;line-height:1.3}
.trio button:hover{background:rgba(255,255,255,.19)}
.trio small{display:block;color:#C9BAFB;font-weight:600;font-size:9.5px;margin-top:3px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr)}}
.app{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:12px 8px 10px;text-align:center;cursor:pointer;transition:transform .13s,border-color .13s;color:var(--txt)}
.app:hover{transform:translateY(-3px)}
.app:disabled{opacity:.42;cursor:not-allowed;transform:none}
.abox{width:38px;height:38px;border-radius:12px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center}
.app b{display:block;font-size:11px;letter-spacing:-.1px}
.app small{display:block;font-size:9px;color:var(--txt3);margin-top:2px}

.btn{background:var(--core);color:var(--core-ink);border:0;border-radius:13px;padding:11px 17px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.rec{background:var(--rose);color:#2A0713}
.btn.sm{padding:8px 13px;font-size:12px;border-radius:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{background:none;border:0;color:var(--core);font-weight:800;font-size:13px;cursor:pointer;padding:6px 0;display:flex;align-items:center;gap:6px}
.q{background:var(--panel2);border-left:4px solid var(--accent,var(--core));border-radius:0 14px 14px 0;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.45;color:var(--txt)}
.ans{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:11px;font-size:14px;resize:vertical;min-height:66px;background:var(--panel2);color:var(--txt)}
.ans:focus{outline:none;border-color:var(--core)}
.chipset{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer}
.chip:hover{border-color:var(--core)}
.chip.on{background:var(--core);color:var(--core-ink);border-color:var(--core)}
.note{font-size:11.5px;color:var(--txt2);line-height:1.5}
.ok{color:var(--mint)}.warn{color:var(--rose)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.stat{grid-template-columns:repeat(4,1fr)}}
.stat div{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat span{font-size:9px;color:var(--txt3);font-weight:800;line-height:1.25;display:block;margin-top:3px;letter-spacing:.4px}

/* ---------- VIVI CHARACTER ---------- */
.stage{position:relative;border-radius:var(--r);overflow:hidden;padding:18px 14px 16px;
  background:radial-gradient(120% 100% at 50% 0%,#3B2496 0%,#1D1152 55%,#120936 100%);border:1px solid var(--line2)}
html[data-theme="light"] .stage{background:radial-gradient(120% 100% at 50% 0%,#EDE8FE 0%,#F6F3FE 60%,#FFFFFF 100%);border-color:var(--line)}
.stage .orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(2px)}
.viviwrap{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:2}
.vivi{width:150px;height:168px;animation:float 3.6s ease-in-out infinite}
.vivi.big{width:190px;height:212px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.vivi .eye{transform-origin:center;animation:blink 5.2s infinite}
.vivi .eye.r{animation-delay:.08s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.vivi.listening .halo{animation:halo 1.5s ease-out infinite}
@keyframes halo{0%{r:52;opacity:.55}100%{r:82;opacity:0}}
.vivi.speaking .mouth{animation:talk .34s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.55)}to{transform:scaleY(1.35)}}
.vivi .mouth{transform-origin:center;transform-box:fill-box}
.vivi.thinking .dot{animation:think 1.1s infinite}
.vivi.thinking .dot:nth-child(2){animation-delay:.16s}
.vivi.thinking .dot:nth-child(3){animation-delay:.32s}
@keyframes think{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.vivi .ant{transform-origin:130px 60px;animation:wig 4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.bubble{background:#fff;color:#150B3D;border-radius:18px;padding:12px 16px;font-size:14.5px;font-weight:700;
  line-height:1.45;max-width:520px;text-align:center;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.bubble:after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
.statechip{font-size:9.5px;font-weight:800;letter-spacing:.7px;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;text-transform:uppercase}
html[data-theme="light"] .statechip{background:var(--panel2);color:var(--txt2)}

/* voice */
.voice{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:11px}
.levels{display:flex;gap:3px;align-items:flex-end;height:30px;flex:1}
.levels i{flex:1;background:var(--line2);border-radius:99px;min-height:3px;transition:height .07s linear}
.levels.live i{background:linear-gradient(180deg,var(--cyan),var(--violet))}
.rectime{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;color:var(--rose);min-width:38px}
audio{width:100%;margin-top:9px;height:34px}

/* lesson */
.subj{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.subj{grid-template-columns:repeat(4,1fr)}}
.subj button{border-radius:var(--r2);border:1px solid var(--line);padding:14px 12px;text-align:left;cursor:pointer;color:var(--txt);background:var(--panel);transition:transform .13s}
.subj button:hover{transform:translateY(-3px)}
.subj b{display:block;font-size:14px;margin-top:8px}
.subj small{display:block;font-size:10px;color:var(--txt3);margin-top:3px}
.screen{border-radius:var(--r2);overflow:hidden;border:1px solid var(--line);background:#0B0620;position:relative}
html[data-theme="light"] .screen{background:#150B3D}
.screen .bar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:rgba(255,255,255,.07)}
.screen .bar i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);display:block}
.screen .body{padding:12px;display:flex;align-items:center;justify-content:center;min-height:170px}
.playbtn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,6,32,.55);cursor:pointer;border:0;color:#fff;font-weight:800;gap:9px;font-size:13px}
.steps{display:flex;gap:5px;margin:12px 0 0}
.steps i{height:5px;flex:1;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--core)}
.fact{background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(124,92,240,.16));border:1px solid var(--line2);
  border-radius:var(--r2);padding:12px 14px;font-size:13px;line-height:1.5}

/* games */
.sud{display:grid;gap:4px;margin:0 auto;width:min(300px,84vw);grid-template-columns:repeat(4,1fr)}
.sud button{aspect-ratio:1;border:1.5px solid var(--line);background:var(--panel2);border-radius:11px;font-size:21px;font-weight:800;color:var(--txt);cursor:pointer}
.sud button.fixed{background:var(--raise);color:var(--txt2);cursor:default}
.sud button.sel{border-color:var(--core);box-shadow:0 0 0 3px rgba(124,92,240,.28)}
.pad{display:flex;gap:7px;justify-content:center;margin-top:11px;flex-wrap:wrap}
.pad button{width:46px;height:46px;border-radius:13px;border:1.5px solid var(--line);background:var(--panel2);font-size:18px;font-weight:800;color:var(--txt);cursor:pointer}
.board{width:min(324px,86vw);margin:0 auto;display:grid;grid-template-columns:repeat(8,1fr);border-radius:12px;overflow:hidden;border:2px solid var(--line2)}
.board div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(25px,6.2vw);cursor:pointer;user-select:none}
.board .l{background:#DDD5F8}.board .d{background:#8B6CF5}
.board div span{color:#150B3D}
.board div.w span{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.board .sel{box-shadow:inset 0 0 0 3px var(--cyan)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(280px,78vw);margin:0 auto}
.mem button{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer}
.mem button.lit{background:var(--violet);border-color:var(--violet);box-shadow:0 0 18px rgba(124,92,240,.6)}
.mem button.hit{background:var(--mint);border-color:var(--mint)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:38dvh;overflow-y:auto;padding:2px}
.bub{max-width:88%;padding:11px 14px;border-radius:17px;font-size:13.5px;line-height:1.5}
.bub.v{background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.bub.c{background:var(--core);color:var(--core-ink);align-self:flex-end;border-bottom-right-radius:5px;font-weight:600}
.bub small{display:block;font-size:9px;opacity:.72;font-weight:800;letter-spacing:.6px;margin-bottom:4px}
.barlist div{margin-bottom:10px}
.barlist span{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:5px}
.track{height:9px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.dock{flex:none;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.dock button{flex:1;background:none;border:0;padding:7px 2px;cursor:pointer;color:var(--txt3);font-size:9px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px}
.dock button.on{color:var(--core)}
.endwrap{text-align:center;padding:28px 14px}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="trow">
      <svg class="logo" viewBox="0 0 200 200" aria-hidden="true">
        <g transform="translate(-6,0)">
          <path d="M100 18 A82 82 0 0 0 100 182 Z" fill="#5B3FE8"/>
          <circle cx="58" cy="80" r="10.5" fill="#fff"/>
          <path d="M48 116 Q69 137 91 118" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/>
        </g>
        <g transform="translate(6,0)">
          <path d="M100 18 Q119 11 131 25 Q150 15 159 36 Q181 42 178 63 Q197 78 183 97 Q197 116 177 127 Q186 147 165 153 Q167 174 144 172 Q130 185 100 180 Z" fill="#FFC93C"/>
          <path d="M108 34 C 132 40, 137 60, 124 71 C 146 79, 147 99, 128 105" fill="none" stroke="#D99A00" stroke-width="6.2" stroke-linecap="round" opacity=".5"/>
          <path d="M120 114 C 144 120, 145 140, 126 149" fill="none" stroke="#D99A00" stroke-width="6.2" stroke-linecap="round" opacity=".5"/>
        </g>
      </svg>
      <span class="brand">OpenMind</span>
      <button class="pill on" id="netBtn">OFFLINE</button>
      <button class="pill" id="langBtn">हिन्दी</button>
      <button class="pill" id="voiceBtn">🔊</button>
      <button class="pill" id="themeBtn">☾</button>
      <span class="spacer"></span>
      <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="4"/>
        <circle id="ringArc" cx="18" cy="18" r="15" fill="none" stroke="var(--core)" stroke-width="4"
                stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="0" transform="rotate(-90 18 18)"/>
        <text id="ringTxt" x="18" y="21.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="currentColor">20</text>
      </svg>
    </div>
    <div class="meter">
      <div class="meterhead"><span id="mLeft">Who is talking</span><span id="mRight">child 0% · target 70%</span></div>
      <div class="mbar"><i class="child" id="mChild" style="width:0%"></i><i class="sys" id="mSys" style="width:100%"></i></div>
    </div>
  </div>
  <div class="main" id="main"><div class="wrap" id="view"></div></div>
  <div class="dock" id="dock"></div>
</div>
<script>

/* ---------- state ---------- */
const Store=(()=>{let mem={};
 const ok=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}})();
 return {get(k,d){try{const v=ok?localStorage.getItem(k):mem[k];return v?JSON.parse(v):d}catch(e){return d}},
         set(k,v){try{const s=JSON.stringify(v);if(ok)localStorage.setItem(k,s);else mem[k]=s}catch(e){}}};})();

const S = Store.get('om_v3',null) || {
  name:'Aarav', streak:4, childWords:0, sysWords:0, questionsAsked:0, recordings:0,
  skills:{Reasoning:38,Expression:31,Curiosity:44,Numbers:35,Focus:29,Empathy:41},
  done:[], revision:[], mood:null, lessons:[], lang:'en', online:false, theme:'dark',
  tts:true, secs:20*60, over:false
};
function save(){Store.set('om_v3',S);}

const T={en:{talk:'Who is talking',child:'child',hi:'Hi',send:'Send',next:'Next',check:'Check',hint:'Give me a hint',back:'Back',speak:'Speak'},
         hi:{talk:'कौन बोल रहा है',child:'बच्चा',hi:'नमस्ते',send:'भेजो',next:'आगे',check:'जाँचो',hint:'इशारा दो',back:'वापस',speak:'बोलो'}};
const t=k=>(T[S.lang]||T.en)[k]||T.en[k];
const words=s=>(s||'').trim().split(/\s+/).filter(Boolean).length;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* duotone icon renderer */
function svg(n,c,st){const o=ICONS[n]||{s:'',l:''};
  return `<svg viewBox="0 0 24 24" style="${st||'width:20px;height:20px'}">
    <g fill="${c||'currentColor'}" fill-opacity=".24">${o.s||''}</g>
    <g fill="none" stroke="${c||'currentColor'}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${o.l}</g></svg>`;}

/* ---------- talk meter + session ring ---------- */
function talk(c,sy){S.childWords+=c||0;S.sysWords+=sy||0;paintMeter();save();}
function paintMeter(){const tot=S.childWords+S.sysWords,pc=tot?Math.round(S.childWords/tot*100):0;
  document.getElementById('mChild').style.width=pc+'%';
  document.getElementById('mSys').style.width=(100-pc)+'%';
  document.getElementById('mLeft').textContent=t('talk');
  document.getElementById('mRight').textContent=`${t('child')} ${pc}% · target 70%`;}
let tickN=0;
function tick(){if(S.over)return;S.secs--;
  if(S.secs<=0){S.secs=0;S.over=true;save();render('end');}
  paintRing();if(++tickN%10===0)save();}
function paintRing(){const f=Math.max(0,S.secs)/(20*60);
  document.getElementById('ringArc').setAttribute('stroke-dashoffset',String(94.2*(1-f)));
  document.getElementById('ringTxt').textContent=Math.ceil(S.secs/60);}

function remember(skill,prompt,answer){
  S.revision.unshift({skill,prompt,answer,due:[3,10,30][S.revision.length%3]});
  S.revision=S.revision.slice(0,18);
  S.skills[skill]=Math.min(100,(S.skills[skill]||30)+3);save();}
function markDone(id){if(!S.done.includes(id))S.done.push(id);save();}

/* ---------- Vivi speaks out loud ---------- */
function say(text){
  if(!S.tts||!window.speechSynthesis)return;
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,''));
    u.lang=S.lang==='hi'?'hi-IN':'en-IN'; u.rate=.96; u.pitch=1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}

const Voice={rec:null,chunks:[],stream:null,ctx:null,analyser:null,raf:null,sr:null,
 secs:0,timer:null,target:null,onDone:null,active:false,
 supported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)},
 srSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)},
 markup(id,label){return `<div class="voice" id="${id}">
   <div class="row" style="gap:10px;flex-wrap:nowrap">
     <button class="btn rec sm" data-voice="${id}">${svg('mic','currentColor','width:15px;height:15px')} ${label||t('speak')}</button>
     <div class="levels" id="${id}_lv">${Array.from({length:22},()=>'<i style="height:3px"></i>').join('')}</div>
     <span class="rectime" id="${id}_t"></span></div>
   <div id="${id}_out"></div>
   <div class="note" id="${id}_msg" style="margin-top:7px">Tap and talk. Your voice stays on this device — nothing is uploaded.</div></div>`},
 async toggle(id,taId,cb){
   if(this.active){this.stop();return;}
   const msg=document.getElementById(id+'_msg');
   this.target=id;this.onDone=cb;
   if(!this.supported()){msg.innerHTML='<span class="warn">No microphone available in this browser.</span> Type your answer instead — on Vivi and Scribe the microphone is always there.';
     const ta=document.getElementById(taId);if(ta)ta.focus();return;}
   try{this.stream=await navigator.mediaDevices.getUserMedia({audio:true});}
   catch(e){msg.innerHTML='<span class="warn">Microphone permission was declined.</span> You can still type your answer.';return;}
   this.chunks=[];
   try{this.rec=new MediaRecorder(this.stream);}catch(e){msg.innerHTML='<span class="warn">Recording is not supported here.</span> Type instead.';return;}
   this.rec.ondataavailable=e=>{if(e.data.size)this.chunks.push(e.data);};
   this.rec.onstop=()=>this._finish(taId);
   this.rec.start();this.active=true;this.secs=0;
   const b=document.querySelector(`[data-voice="${id}"]`);
   if(b)b.innerHTML=svg('stop','currentColor','width:14px;height:14px')+' Stop';
   msg.textContent='Listening…';
   const vv=document.querySelector('.vivi'); if(vv){vv.classList.remove('idle','speaking');vv.classList.add('listening');}
   this._meter(id);this._clock(id);
   if(this.srSupported())this._transcribe(taId);
 },
 _meter(id){try{const AC=window.AudioContext||window.webkitAudioContext;
   this.ctx=new AC();const src=this.ctx.createMediaStreamSource(this.stream);
   this.analyser=this.ctx.createAnalyser();this.analyser.fftSize=64;src.connect(this.analyser);
   const data=new Uint8Array(this.analyser.frequencyBinCount);
   const bars=document.getElementById(id+'_lv');bars.classList.add('live');
   const loop=()=>{if(!this.active)return;this.analyser.getByteFrequencyData(data);
     [...bars.children].forEach((b,i)=>{b.style.height=Math.max(3,Math.round(data[i%data.length]/255*30))+'px';});
     this.raf=requestAnimationFrame(loop);};loop();}catch(e){}},
 _clock(id){const el=document.getElementById(id+'_t');
   this.timer=setInterval(()=>{this.secs++;if(el)el.textContent='0:'+String(this.secs).padStart(2,'0');
     if(this.secs>=90)this.stop();},1000);},
 _transcribe(taId){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
   try{this.sr=new SR();this.sr.lang=S.lang==='hi'?'hi-IN':'en-IN';
     this.sr.interimResults=true;this.sr.continuous=true;
     const ta=document.getElementById(taId);const base=ta?ta.value:'';
     this.sr.onresult=ev=>{let s='';for(let i=0;i<ev.results.length;i++)s+=ev.results[i][0].transcript;
       if(ta)ta.value=(base+' '+s).trim();};
     this.sr.onerror=()=>{};this.sr.start();}catch(e){}},
 stop(){if(!this.active)return;this.active=false;
   try{this.rec&&this.rec.state!=='inactive'&&this.rec.stop()}catch(e){}
   try{this.sr&&this.sr.stop()}catch(e){}
   clearInterval(this.timer);cancelAnimationFrame(this.raf);
   try{this.ctx&&this.ctx.close()}catch(e){}
   try{this.stream&&this.stream.getTracks().forEach(x=>x.stop())}catch(e){}
   const id=this.target,b=document.querySelector(`[data-voice="${id}"]`);
   if(b)b.innerHTML=svg('mic','currentColor','width:15px;height:15px')+' '+t('speak');
   const lv=document.getElementById(id+'_lv');
   if(lv){lv.classList.remove('live');[...lv.children].forEach(x=>x.style.height='3px');}
   const vv=document.querySelector('.vivi');if(vv){vv.classList.remove('listening');vv.classList.add('idle');}},
 _finish(taId){const id=this.target,out=document.getElementById(id+'_out'),msg=document.getElementById(id+'_msg');
   if(this.chunks.length&&out){const blob=new Blob(this.chunks,{type:this.chunks[0].type||'audio/webm'});
     out.innerHTML=`<audio controls src="${URL.createObjectURL(blob)}"></audio>`;S.recordings++;save();}
   const ta=document.getElementById(taId),said=ta?words(ta.value):0;
   if(msg)msg.innerHTML=said?`Heard about <b>${said} words</b>. Check the text, fix anything wrong, then send it.`
     :'Recorded. Your device could not turn it into text, so type the gist and Vivi will work from that.';
   if(said)talk(said,0);
   if(typeof this.onDone==='function')this.onDone(said);}
};

  open:'What do you already know about why the sky is blue?',
  steps:[
   {ask:'Most people say “because it reflects the sea”. If that were true, what colour would the sky be over a desert?',

/* ---------------- LESSON PLAYER ---------------- */
let L={key:null,step:-1,stage:'ask',answered:0,played:false};
VIEWS.lesson=()=>{
  const l=LESSONS[L.key];if(!l)return VIEWS.learn();
  const total=l.steps.length+2;
  const isOpen=L.step<0, isRecap=L.step>=l.steps.length, isDone=L.stage==='done';
  const line = isDone ? 'You explained it back in your own words. That is what finishing a lesson means.'
             : isOpen ? l.open : isRecap ? l.recap : l.steps[L.step].ask;
  const showFact = L.stage==='fact' && !isOpen && !isRecap;
  return `
  <button class="back" data-lesson="quit">← ${l.title}</button>
  ${stageBlock(showFact||isDone?'speaking':'idle',line,isDone?'Lesson complete':showFact?'Vivi is explaining':'Vivi is asking')}
  <div class="steps">${Array.from({length:total},(_,i)=>`<i class="${i<=L.step+1?'on':''}"></i>`).join('')}</div>
  <div class="card" style="margin-top:11px;--accent:var(--cyan)">
    <div class="screen"><div class="bar"><i></i><i></i><i></i>
      <span style="font-size:9.5px;color:#8B7BC8;font-weight:800;letter-spacing:.5px;margin-left:4px">LESSON SCREEN</span></div>
      <div class="body">${VIS[l.vis]||''}</div>
      ${L.played?'':`<button class="playbtn" id="lplay">${svg('play','#fff','width:26px;height:26px')} Show me the picture</button>`}
    </div>
  </div>
  ${isDone?`<div class="fact" style="margin-top:11px">${svg('check','var(--mint)','width:16px;height:16px;vertical-align:-3px')} <b>Saved as a revision card.</b> Vivi will ask you this again in three days — without the picture.</div>
    <div class="row" style="margin-top:11px"><button class="btn" data-lesson="quit">Back to ${SUBJECTS.find(x=>x.id===l.sub).n}</button>
      <button class="btn ghost sm" data-go="revise">See my revision cards</button></div>`
  :showFact?`<div class="fact" style="margin-top:11px">${svg('bulb','var(--cyan)','width:16px;height:16px;vertical-align:-3px')} <b>${l.steps[L.step].fact}</b></div>

};

/* ---------------- SUDOKU ---------------- */
let sud=null;
function newSudoku(){const base=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];
 const p=[1,2,3,4].sort(()=>Math.random()-.5);
 const sol=base.map(r=>r.map(v=>p[v-1])),grid=sol.map(r=>r.slice());
 let h=7;while(h>0){const r=(Math.random()*4)|0,c=(Math.random()*4)|0;if(grid[r][c]){grid[r][c]=0;h--;}}
 sud={sol,grid,fixed:grid.map(r=>r.map(v=>!!v)),sel:null,solved:false};}
VIEWS.sudoku=()=>{if(!sud||sud.solved)newSudoku();
 return `<button class="back" data-go="home">← ${t('back')}</button>
 <h1>Sudoku</h1><p class="sub">Every row, column and 2×2 box holds 1 to 4 once. Tap a square, then a number.</p>
 <div class="card" style="--accent:var(--sky)">
  <div class="sud" id="sud">${sud.grid.map((row,r)=>row.map((v,c)=>
    `<button class="${sud.fixed[r][c]?'fixed':''}" data-r="${r}" data-c="${c}">${v||''}</button>`).join('')).join('')}</div>
  <div class="pad">${[1,2,3,4].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="0">✕</button></div>
  <div class="q" style="margin-top:13px" id="sudq">Before you fill anything in — which row or column already has the most numbers? Start there. Why is that the easiest place to begin?</div>
  <div class="row" style="margin-top:10px"><button class="btn sm" id="sudcheck">${t('check')}</button><button class="btn ghost sm" id="sudhint">${t('hint')}</button></div></div>`;};

const PUZZ=[
 {fen:["....k...","........","....K...","........","........","........","........",".......R"],from:'h1',to:'h8',
  hint:'The black king has no escape squares on the back rank. What piece can reach that rank in one move?',
  why:'Rook to h8 — the king cannot step forward because your king covers those squares.'},
 {fen:["......k.","......pp","........","........","........","........","......PP","...Q..K."],from:'d1',to:'d8',
  hint:"Black's king is boxed in by its own pawns. Which line is completely open?",
  why:'Queen to d8 — the back rank is open and the pawns block the king’s own escape.'},
 {fen:[".....rk.",".....ppp","........","........","........","........","......PP",".....R.K"],from:'f1',to:'f8',
  hint:'Count the defenders of f8. Then count the attackers.',
  why:'Rook takes f8 — once the ranks are counted, nothing defends it.'}];
const GLYPH={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟',K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
let cp=0,csel=null,cmsg='';
VIEWS.chess=()=>{const p=PUZZ[cp%PUZZ.length];let cells='';
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){const ch=p.fen[r][c],sq='abcdefgh'[c]+(8-r),wh=ch&&ch===ch.toUpperCase();
   cells+=`<div class="${(r+c)%2?'d':'l'} ${wh?'w':''} ${csel===sq?'sel':''}" data-sq="${sq}">${ch&&GLYPH[ch]?`<span>${GLYPH[ch]}</span>`:''}</div>`;}
 return `<button class="back" data-go="home">← ${t('back')}</button>
 <h1>Chess · mate in one</h1><p class="sub">White to play. Tap the piece, then where it goes.</p>
 <div class="card" style="--accent:var(--indigo)"><div class="board" id="board">${cells}</div>
  <div class="q" style="margin-top:13px">${cmsg||'Before you touch a piece: where can the black king actually go? Name the squares in your head.'}</div>
  <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="chint">${t('hint')}</button><button class="btn ghost sm" id="cskip">${t('next')} puzzle</button></div></div>`;};

 const sk2=S.skills,keys=Object.keys(sk2);
 const pt=(i,v)=>{const a=(Math.PI*2*i/keys.length)-Math.PI/2,r=18+v*.62;return[100+r*Math.cos(a),100+r*Math.sin(a)];};
 const poly=keys.map((k,i)=>pt(i,sk2[k]).map(n=>n.toFixed(1)).join(',')).join(' ');
 const rings=[25,50,75,100].map(v=>`<polygon points="${keys.map((k,i)=>pt(i,v).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');

 return `<h1>Progress</h1><p class="sub">We do not report time on the app. We report how much you said, asked and could explain.</p>
 <div class="card"><div class="row" style="justify-content:center">

   <polygon points="${poly}" fill="rgba(124,92,240,.3)" stroke="var(--violet)" stroke-width="2.5"/>
   ${keys.map((k,i)=>{const[x,y]=pt(i,116);return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" font-size="9" font-weight="800" fill="currentColor" text-anchor="${x>108?'start':x<92?'end':'middle'}">${k}</text>`}).join('')}
  </svg></div></div>
 <div class="card"><h2 style="margin-top:0">This week</h2><div class="barlist">
  ${[['Child talk share',pc,'70% target'],['Questions asked',Math.min(100,S.questionsAsked*12),S.questionsAsked+' today'],
     ['Lessons finished',Math.min(100,S.lessons.length*25),S.lessons.length+' done'],['Explanations recorded',Math.min(100,S.recordings*20),S.recordings+' clips']]
    .map(([l,v,r])=>`<div><span><b>${l}</b><i style="font-style:normal;color:var(--txt3)">${r}</i></span><div class="track"><i style="width:${Math.min(100,v)}%"></i></div></div>`).join('')}
 </div></div>
 <div class="card"><h2 style="margin-top:0">Mastery map</h2>
  <div class="note">Solid means you could <b style="color:var(--txt)">explain it back</b> without help — not that you got it right once.</div>
  <div class="row" style="margin-top:11px">${['Fractions','Place value','Why ice floats','Sequences','Persuading','Listening','Moon phases','Deduction']
   .map((n,i)=>`<div style="background:${i<3?'var(--violet)':i<6?'var(--panel2)':'transparent'};border:1px solid ${i<6?'transparent':'var(--line)'};color:${i<3?'#150B3D':'var(--txt2)'};border-radius:11px;padding:7px 12px;font-size:11.5px;font-weight:700">${n}</div>`).join('')}
 </div></div>`;};

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-go]');if(nav){curSubj=null;go(nav.getAttribute('data-go'));return;}
 const vb=e.target.closest('[data-voice]');
 if(vb){const id=vb.getAttribute('data-voice');
  const map={vv:'vin',ex:'exin',sk:'skin',sr:'skreb',st:'stin',bt:'bin',vd:'vedwhy',pt:'pwhy',od:'oin',mn:'min',mo:'moin',ln:'lin'};
  Voice.toggle(id,map[id]);return;}

 /* ---- LEARN ---- */
 const sb2=e.target.closest('[data-subj]');
 if(sb2){const v=sb2.getAttribute('data-subj');curSubj=v==='none'?null:v;render('learn');return;}
 const lb=e.target.closest('[data-lesson]');
 if(lb){const k=lb.getAttribute('data-lesson');
  if(k==='quit'){L={key:null,step:-1,stage:'ask',answered:0,played:false};render('learn');return;}
  L={key:k,step:-1,stage:'ask',answered:0,played:false};render('lesson');say(LESSONS[k].open);return;}
 if(e.target.closest('#lplay')){L.played=true;render('lesson');return;}
 if(e.target.closest('#lsend')){
  const l=LESSONS[L.key],ta=document.getElementById('lin'),tx=ta?ta.value:'';
  if(words(tx)<3){document.getElementById('lmsg').innerHTML='Even a guess counts — give me a sentence.';return;}
  talk(words(tx),0);L.answered++;S.questionsAsked++;
  const isOpen=L.step<0,isRecap=L.step>=l.steps.length;
  if(isRecap){
   if(!S.lessons.includes(L.key))S.lessons.push(L.key);
   S.skills.Curiosity=Math.min(100,S.skills.Curiosity+4);
   remember('Curiosity',l.recap,tx);markDone('learn');save();
   L.stage='done';curSubj=l.sub;render('lesson');
   say('Good. I will ask you this again in three days.');return;}
  if(isOpen){L.step=0;L.stage='ask';render('lesson');say(l.steps[0].ask);return;}
  L.stage='fact';render('lesson');say(l.steps[L.step].fact);return;}
 if(e.target.closest('#lnext')){
  const l=LESSONS[L.key];L.step++;L.stage='ask';render('lesson');
  say(L.step>=l.steps.length?l.recap:l.steps[L.step].ask);return;}
 if(e.target.closest('#lskip')){
  const l=LESSONS[L.key],isOpen=L.step<0,isRecap=L.step>=l.steps.length;
  const hint=isOpen?'Start smaller: have you ever noticed it change? When?'
   :isRecap?'Just the first sentence, then. What is the one thing you would tell a friend?'
   :'Then guess. A wrong guess I can work with; silence I cannot.';
  document.getElementById('lmsg').innerHTML=hint;say(hint);talk(0,words(hint));return;}

 /* ---- VIVI ---- */
 const dm=e.target.closest('[data-demo]');
 if(dm){const k=dm.getAttribute('data-demo');
  if(k==='clear'){demoKey=null;demoStep=0;viviLog=[];viviState='idle';}
  else{demoKey=k;demoStep=0;viviState='idle';
   viviLog=[{who:'v',text:'Demo loaded: “'+DEMOS[k].label+'”. Press play and watch me hand the thinking back.'}];}
  render('vivi');return;}
 if(e.target.closest('#demoNext')){
  const d=DEMOS[demoKey];
  if(demoStep<d.turns.length){const[who,text]=d.turns[demoStep++];
   viviLog.push({who,text});talk(who==='c'?words(text):0,who==='v'?words(text):0);
   viviState=who==='v'?'speaking':'listening';
   if(who==='v')say(text);
   if(demoStep>=d.turns.length){markDone('vivi');S.questionsAsked+=3;
    remember('Curiosity','In the “'+d.label+'” conversation, what did you work out for yourself?',d.turns[d.turns.length-2][1]);}}
  render('vivi');const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;
  setTimeout(()=>{const v=document.querySelector('.vivi');if(v){v.classList.remove('speaking','listening');v.classList.add('idle');}},2200);
  return;}
 if(e.target.closest('#vsend')){
  const el=document.getElementById('vin'),tx=el.value.trim();if(words(tx)<3)return;
  viviLog.push({who:'c',text:tx});talk(words(tx),0);
  const rep=(Math.random()<.3?pick(PRAISE)+' ':'')+pick(PROBE);
  viviLog.push({who:'v',text:rep});talk(0,words(rep));viviState='speaking';say(rep);
  if(viviLog.length>=8){markDone('vivi');remember('Curiosity','Vivi asked: '+rep,tx);}
  render('vivi');const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;return;}
 if(e.target.closest('#vask')){S.questionsAsked++;save();
  const line='Ask away — but tell me what you already think the answer is, first.';
  viviLog.push({who:'v',text:line});viviState='thinking';say(line);render('vivi');return;}

 /* ---- EXPLAIN ---- */
 if(e.target.closest('#exnew')){exTopic=pick(EXPLAIN_TOPICS);exStage=0;render('explain');return;}
 if(e.target.closest('#exdone')){
  const tx=(document.getElementById('exin')||{}).value||'',m=document.getElementById('exmsg');
  if(words(tx)<8&&!S.recordings){m.innerHTML='Record it or type it — even four sentences will do.';return;}
  talk(words(tx),10);exStage=1;markDone('explain');
  remember('Expression','Explain again, from memory: '+exTopic,tx||'(recorded)');
  render('explain');document.getElementById('exmsg').innerHTML='<b class="ok">Saved.</b> In three days Vivi will ask you this again — and you will not have your notes.';return;}
 const sc=e.target.closest('[data-selfcheck]');
 if(sc){sc.classList.toggle('on');S.skills.Expression=Math.min(100,S.skills.Expression+1);save();return;}

 /* ---- SUDOKU ---- */
 if(e.target.closest('#sud button')){const b=e.target.closest('button'),r=+b.dataset.r,c=+b.dataset.c;
  if(sud.fixed[r][c])return;sud.sel=[r,c];
  document.querySelectorAll('#sud button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');return;}
 if(e.target.closest('.pad button')&&sud&&sud.sel){const n=+e.target.closest('button').dataset.n,[r,c]=sud.sel;
  sud.grid[r][c]=n;render('sudoku');
  const cells=document.querySelectorAll('#sud button');cells[r*4+c].classList.add('sel');return;}
 if(e.target.closest('#sudcheck')){const flat=sud.grid.flat(),q=document.getElementById('sudq');
  if(flat.includes(0)){q.innerHTML='Not full yet. Which square are you least sure about — and what is stopping you?';return;}
  if(sud.grid.every((row,r)=>row.every((v,c)=>v===sud.sol[r][c]))){
   q.innerHTML='<b class="ok">Solved.</b> Now the real question: which square did you work out <i>first</i>, and what told you the answer?';
   sud.solved=true;markDone('sudoku');talk(0,18);
   remember('Reasoning','In sudoku, which square do you look for first — and why?','The one with the fewest possibilities left.');
  }else q.innerHTML='Something clashes. Go row by row — <b>which row has a number twice?</b>';return;}
 if(e.target.closest('#sudhint')){document.getElementById('sudq').innerHTML='I will not fill it in. Look at the top-left 2×2 box — <b>which two numbers are missing?</b> Only one can go in the empty square. Why?';return;}

 /* ---- CHESS ---- */
 if(e.target.closest('#board div')){const sq=e.target.closest('div').dataset.sq,p=PUZZ[cp%PUZZ.length];
  if(!csel){csel=sq;render('chess');return;}
  if(csel===p.from&&sq===p.to){cmsg='<b class="ok">Mate.</b> '+p.why+' Before you move on — could another piece have done it?';
   markDone('chess');talk(0,22);
   remember('Reasoning','How do you spot a back-rank mate?','The king is blocked by its own pawns and a rook or queen reaches the open rank.');
  }else cmsg='Not that one. Play it out in your head: <b>after that move, where does the black king run?</b>';
  csel=null;render('chess');return;}
 if(e.target.closest('#chint')){cmsg=PUZZ[cp%PUZZ.length].hint;render('chess');return;}
 if(e.target.closest('#cskip')){cp++;cmsg='';csel=null;render('chess');return;}

 /* ---- VEDIC / PATTERN ---- */
 if(e.target.closest('#vedgo')){const v=VEDIC[vi%VEDIC.length],val=+document.getElementById('vedin').value,m=document.getElementById('vedmsg');
  if(val===v.a){vstage=1;render('vedic');document.getElementById('vedmsg').innerHTML='<b class="ok">Right.</b> Faster than long multiplication, wasn’t it?';}
  else m.innerHTML='Not quite. Do it the slow way once — <b>what do you get?</b> Then tell me where the trick went wrong for you.';return;}
 if(e.target.closest('#vedwhygo')){const tx=document.getElementById('vedwhy').value;
  if(words(tx)<4){document.getElementById('vedmsg').innerHTML='Give me a full sentence.';return;}
  talk(words(tx),12);S.questionsAsked++;markDone('vedic');
  remember('Numbers',VEDIC[vi%VEDIC.length].probe,tx);
  document.getElementById('vedmsg').innerHTML='<b class="ok">Saved.</b> I will ask you this again in three days, from memory.';
  vi++;vstage=0;setTimeout(()=>render('vedic'),1500);return;}
 if(e.target.closest('#pgo')){const p=PATTERNS[pi%PATTERNS.length],val=+document.getElementById('pin').value;
  if(val===p.next){pstage=1;render('pattern');}
  else document.getElementById('pmsg').innerHTML='Not that. <b>Write down the gaps between the numbers</b> — what are they doing?';return;}
 if(e.target.closest('#pwhygo')){const tx=document.getElementById('pwhy').value;
  if(words(tx)<4){document.getElementById('pmsg').innerHTML='A full sentence, in your own words.';return;}
  talk(words(tx),14);markDone('pattern');
  remember('Reasoning','Describe the rule behind 2, 6, 12, 20, 30…','The gap grows by two each time.');
  document.getElementById('pmsg').innerHTML='<b class="ok">Good.</b> The official version: '+PATTERNS[pi%PATTERNS.length].why+' Yours was close enough to count.';
  pi++;pstage=0;setTimeout(()=>render('pattern'),1900);return;}

 /* ---- MEMORY ---- */
 if(e.target.closest('#memstart')){
  mem.seq=Array.from({length:mem.level},()=>(Math.random()*9)|0);mem.input=[];mem.playing=true;mem.msg='Watch…';
  render('memory');const btns=document.querySelectorAll('#mem button');
  mem.seq.forEach((v,i)=>setTimeout(()=>{if(btns[v]){btns[v].classList.add('lit');setTimeout(()=>btns[v].classList.remove('lit'),420);}},i*640));
  setTimeout(()=>{mem.playing=false;mem.msg='Now repeat the order.';render('memory');},mem.seq.length*640+260);return;}
 const mb=e.target.closest('[data-m]');
 if(mb&&mem.seq.length&&!mem.playing){const v=+mb.dataset.m;mem.input.push(v);
  mb.classList.add('hit');setTimeout(()=>mb.classList.remove('hit'),200);
  const i=mem.input.length-1;
  if(mem.input[i]!==mem.seq[i]){mem.msg='Not that one. <b>Which square did you lose — the first, the middle or the last?</b> That tells you where your attention slipped.';
   mem.seq=[];render('memory');return;}
  if(mem.input.length===mem.seq.length){mem.level++;S.skills.Focus=Math.min(100,S.skills.Focus+3);markDone('memory');talk(0,8);save();
   mem.msg='<b class="ok">All of it.</b> Level '+mem.level+' next. What did you do in your head to hold the order?';
   mem.seq=[];render('memory');}return;}

 /* ---- ODD / MONEY / MOOD ---- */
 const ob=e.target.closest('[data-odd]');if(ob){opick=+ob.dataset.odd;render('odd');return;}
 if(e.target.closest('#ogo')){const tx=document.getElementById('oin').value;
  if(words(tx)<4){document.getElementById('omsg').innerHTML='A reason, in a full sentence.';return;}
  talk(words(tx),10);markDone('odd');S.questionsAsked++;
  remember('Reasoning','Odd one out: '+ODD[oi%ODD.length].items.join(', ')+' — what was your reason?',tx);
  document.getElementById('omsg').innerHTML='<b class="ok">Accepted.</b> Someone else could pick a different one and still be right — as long as they can do what you just did.';
  oi++;opick=null;setTimeout(()=>render('odd'),2000);return;}
 const mo2=e.target.closest('[data-money]');if(mo2){mopt=+mo2.dataset.money;render('money');return;}
 if(e.target.closest('#mgo')){const tx=document.getElementById('min').value;
  if(words(tx)<4){document.getElementById('mmsg').innerHTML='Name the thing you gave up.';return;}
  talk(words(tx),12);markDone('money');
  remember('Reasoning','Money choice: '+MONEY[mi%MONEY.length].s.slice(0,60)+'… what did you give up?',tx);
  document.getElementById('mmsg').innerHTML='<b class="ok">That is the whole idea.</b> Every choice costs you the one you did not make. Economists call it opportunity cost — you just called it by its real name.';
  mi++;mopt=null;setTimeout(()=>render('money'),2400);return;}
 const mdb=e.target.closest('[data-mood]');if(mdb){S.mood=+mdb.dataset.mood;save();render('mood');return;}
 if(e.target.closest('#mogo')){const tx=document.getElementById('moin').value;
  if(words(tx)<4){document.getElementById('momsg').innerHTML='A sentence is enough.';return;}
  talk(words(tx),10);markDone('mood');S.skills.Empathy=Math.min(100,S.skills.Empathy+3);
  remember('Empathy','You felt '+MOODS[S.mood][1].toLowerCase()+' — what set it off, and what helped?',tx);
  document.getElementById('momsg').innerHTML='<b class="ok">Noted, and private.</b> Your parent sees that you checked in, never what you wrote.';return;}

 /* ---- SEEKHO / STORY / CURIOSITY ---- */
 const sd=e.target.closest('[data-side]');
 if(sd){const v=sd.dataset.side;
  if(v==='new'){sk.motion=pick(MOTIONS);render('seekho');return;}
  sk.side=v;sk.stage=1;sk.secs=60;render('seekho');clearInterval(sk.run);
  sk.run=setInterval(()=>{sk.secs--;const el=document.getElementById('sktime');if(el)el.textContent=sk.secs;if(sk.secs<=0)clearInterval(sk.run);},1000);return;}
 if(e.target.closest('#skdone')){clearInterval(sk.run);
  const tx=document.getElementById('skin').value;sk.wordCount=words(tx);
  sk.reasons=Math.max(1,(tx.match(/because|since|so that|first|second|third|also/gi)||[]).length);
  if(sk.wordCount<8){document.getElementById('sk_msg').innerHTML='Say a bit more first — even three short reasons will do.';return;}
  talk(sk.wordCount,20);
  sk.rebut=sk.side==='for'?'Here is the other side: without homework the only practice a child gets is in a noisy classroom with thirty others. <b>What would you replace it with?</b>'
   :'Here is the other side: some things only stick if you do them alone, slowly, at home. <b>How would you get that without homework?</b>';
  sk.stage=2;render('seekho');return;}
 if(e.target.closest('#skrebgo')){const tx=document.getElementById('skreb').value;
  if(words(tx)<5){document.getElementById('sr_msg').innerHTML='Answer it properly — one good sentence.';return;}
  sk.rebuttalWords=words(tx);talk(sk.rebuttalWords,10);S.questionsAsked+=2;markDone('seekho');
  S.skills.Expression=Math.min(100,S.skills.Expression+3);
  remember('Expression','You argued about “'+sk.motion+'”. What was the best point against you?',tx);
  sk.stage=3;render('seekho');return;}
 if(e.target.closest('#sknew')){sk={motion:pick(MOTIONS),side:null,stage:0,secs:60,run:null};render('seekho');return;}
 if(e.target.closest('#stgo')){const el=document.getElementById('stin'),tx=el.value.trim();if(words(tx)<3)return;
  story.push({who:'c',text:tx});talk(words(tx),0);
  const turns=['And then? Careful — you have to keep what you just wrote true.','Who else is in the room now? Give them one line of speech.',
   'Something goes wrong here. What is it?','Now end it in one sentence. No cheating with “it was a dream”.'];
  story.push({who:'v',text:turns[Math.min(story.length>>1,turns.length-1)]});talk(0,12);
  if(story.length>=8){markDone('story');remember('Expression','Retell the story you built with Vivi in three sentences.',tx);}
  render('story');return;}
 if(e.target.closest('#bgo')){const tx=document.getElementById('bin').value;
  if(words(tx)<4){document.getElementById('bt_msg').innerHTML='A full sentence — guessing is allowed, silence is not.';return;}
  talk(words(tx),14);S.questionsAsked++;bstep++;
  if(bstep>=bite.steps.length){markDone('bite');remember('Curiosity',bite.q,tx);bite=null;bstep=0;render('bite');
   document.getElementById('bt_msg').innerHTML='<b class="ok">That is the whole chain.</b> Notice I never told you the answer — you built it.';return;}
  render('bite');return;}

 /* ---- REVISION ---- */
 const rv=e.target.closest('[data-rev]');
 if(rv){const i=+rv.dataset.rev,tx=document.getElementById('rev'+i).value,m=document.getElementById('revmsg'+i);
  if(words(tx)<4){m.innerHTML='From memory, in a full sentence.';return;}
  talk(words(tx),8);
  const nd=S.revision[i].due===3?10:S.revision[i].due===10?30:60;
  m.innerHTML='<b class="ok">Held.</b> This card moves to day '+nd+'.';
  S.revision[i].due=nd;S.skills[S.revision[i].skill]=Math.min(100,(S.skills[S.revision[i].skill]||30)+2);save();return;}

 /* ---- SHELL ---- */
 if(e.target.closest('#netBtn')){S.online=!S.online;save();paintChrome();render(route);return;}
 if(e.target.closest('#langBtn')){S.lang=S.lang==='en'?'hi':'en';save();paintChrome();render(route);return;}
 if(e.target.closest('#themeBtn')){S.theme=S.theme==='dark'?'light':'dark';save();paintChrome();return;}
 if(e.target.closest('#voiceBtn')){S.tts=!S.tts;save();paintChrome();if(!S.tts&&window.speechSynthesis)speechSynthesis.cancel();return;}
 if(e.target.closest('#restart')){S.secs=20*60;S.over=false;S.childWords=0;S.sysWords=0;S.questionsAsked=0;S.recordings=0;S.done=[];save();
  paintRing();paintMeter();render('home');return;}
});

function paintChrome(){
 document.documentElement.setAttribute('data-theme',S.theme);
 const n=document.getElementById('netBtn');
 n.textContent=S.online?'WIFI ON':'OFFLINE';n.classList.toggle('on',!S.online);n.classList.toggle('live',S.online);
 document.getElementById('langBtn').textContent=S.lang==='en'?'हिन्दी':'English';
 document.getElementById('themeBtn').textContent=S.theme==='dark'?'☾':'☀';
 const v=document.getElementById('voiceBtn');
 v.textContent=S.tts?'🔊':'🔇';v.classList.toggle('on',S.tts);
}
paintChrome();paintMeter();paintRing();render('home');
setInterval(tick,1000);
</script>
</body>
</html>
